<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>康威生命游戏</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='15' font-weight='600' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#14161b;--muted:#6b7280;--line:#e3e6ec;--accent:#3b5bfd}
*{box-sizing:border-box}
body{margin:0;padding:24px 20px 36px;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:660px;margin:0 auto}
a.back{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--muted);text-decoration:none}
a.back:hover{color:var(--ink)}
h1{font-size:20px;margin:0 0 6px;font-weight:500}
p.sub{margin:0 0 16px;font-size:13px;line-height:1.7;color:var(--muted)}
canvas{display:block;width:100%;height:auto;background:#0f1117;border-radius:12px;touch-action:none;cursor:crosshair}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
button{font:inherit;font-size:13px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button:hover{border-color:#c9cfdb}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
label.speed{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
input[type=range]{accent-color:var(--accent);width:110px}
.stat{margin-top:12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" id="back" href="../../index.html" hidden>← 返回大厅</a>
  <h1>康威生命游戏</h1>
  <p class="sub">活格周围有 2 或 3 个活邻居则继续存活；死格周围恰好 3 个活邻居则复活。点格子改生死，按住可以拖着画，右键擦除。</p>
  <canvas id="board"></canvas>
  <div class="controls">
    <button id="toggle" class="primary" type="button">播放</button>
    <button id="stepOnce" type="button">单步</button>
    <button id="random" type="button">随机铺满</button>
    <button id="clear" type="button">清空</button>
    <label class="speed">速度<input id="speed" type="range" min="1" max="20" value="8"></label>
  </div>
  <div class="stat" id="stat"></div>
</div>
<script>
const COLS = 44, ROWS = 30, CELL = 14;
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = COLS * CELL * dpr;
canvas.height = ROWS * CELL * dpr;
ctx.scale(dpr, dpr);

let grid = new Uint8Array(COLS * ROWS);
let scratch = new Uint8Array(COLS * ROWS);
let gen = 0, timer = null, running = false, painting = false;

const idx = (x, y) => y * COLS + x;
const at = (x, y) => grid[((y + ROWS) % ROWS) * COLS + ((x + COLS) % COLS)];

function draw() {
  ctx.fillStyle = '#0f1117';
  ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);
  ctx.fillStyle = '#cfe0ff';
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (grid[idx(x, y)]) ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
    }
  }
  const alive = grid.reduce((a, b) => a + b, 0);
  document.getElementById('stat').textContent = `第 ${gen} 代 · 活细胞 ${alive}`;
}

function step() {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const n = at(x - 1, y - 1) + at(x, y - 1) + at(x + 1, y - 1)
              + at(x - 1, y) + at(x + 1, y)
              + at(x - 1, y + 1) + at(x, y + 1) + at(x + 1, y + 1);
      scratch[idx(x, y)] = grid[idx(x, y)]
        ? (n === 2 || n === 3 ? 1 : 0)
        : (n === 3 ? 1 : 0);
    }
  }
  const t = grid; grid = scratch; scratch = t;
  gen++;
  draw();
}

function delay() {
  return 280 - Number(document.getElementById('speed').value) * 12;
}

function play() {
  running = true;
  document.getElementById('toggle').textContent = '暂停';
  const tick = () => {
    if (!running) return;
    step();
    timer = setTimeout(tick, delay());
  };
  timer = setTimeout(tick, delay());
}

function pause() {
  running = false;
  clearTimeout(timer);
  document.getElementById('toggle').textContent = '播放';
}

document.getElementById('toggle').addEventListener('click', () => (running ? pause() : play()));

document.getElementById('stepOnce').addEventListener('click', () => {
  pause();
  step();
});

document.getElementById('random').addEventListener('click', () => {
  pause();
  grid = new Uint8Array(COLS * ROWS).map(() => (Math.random() < 0.3 ? 1 : 0));
  gen = 0;
  draw();
});

document.getElementById('clear').addEventListener('click', () => {
  pause();
  grid = new Uint8Array(COLS * ROWS);
  gen = 0;
  draw();
});

function paint(event) {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor(((event.clientX - rect.left) / rect.width) * COLS);
  const y = Math.floor(((event.clientY - rect.top) / rect.height) * ROWS);
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
  grid[idx(x, y)] = event.buttons === 2 ? 0 : 1;
  draw();
}

canvas.addEventListener('pointerdown', (event) => {
  if (event.button === 2) return;
  painting = true;
  canvas.setPointerCapture(event.pointerId);
  paint(event);
});
canvas.addEventListener('pointermove', (event) => {
  if (painting) paint(event);
});
canvas.addEventListener('pointerup', () => { painting = false; });
canvas.addEventListener('pointercancel', () => { painting = false; });
canvas.addEventListener('contextmenu', (event) => {
  event.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor(((event.clientX - rect.left) / rect.width) * COLS);
  const y = Math.floor(((event.clientY - rect.top) / rect.height) * ROWS);
  if (x >= 0 && y >= 0 && x < COLS && y < ROWS) {
    grid[idx(x, y)] = 0;
    draw();
  }
});

if (window.self === window.top) document.getElementById('back').hidden = false;

const seed = [[21, 14], [22, 15], [20, 16], [21, 16], [22, 16]];
for (const [x, y] of seed) grid[idx(x, y)] = 1;
draw();
</script>
</body>
</html>
